[package]
name = "vectomancy-cli"
version = "8.1.0"
edition = "2021"
description = "Vectomancy - CLI tool"
license = "MIT"
repository = "https://github.com/Xuepoo/vectomancy"

[[bin]]
name = "vectomancy"
path = "src/main.rs"

[dependencies]
vectomancy = { path = "..", version = "8.1.0", features = ["gpu"] }
vectomancy-video = { path = "../video", version = "8.1.0", optional = true }
vectomancy-text = { path = "../text", version = "8.1.0" }
clap_complete = "4.4"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true }

# Workspace dependencies inherited
clap = { workspace = true }
rayon = { workspace = true }
wgpu = { workspace = true }
tracing = { workspace = true }

[features]
default = ["video"]
video = ["dep:vectomancy-video"]

[dev-dependencies]
image = { version = "0.25", features = ["png"] }
tempfile = "3.8"
