name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint with Clippy
        # Exclude vectomancy-video and vectomancy-cli from the workspace pass:
        # vectomancy-video requires ffmpeg-next 9 headers (Ubuntu noble ships 6.1).
        # vectomancy-cli default features pull in vectomancy-video via the "video"
        # feature; lint it separately without default features.
        run: |
          cargo clippy --workspace --exclude vectomancy-video --exclude vectomancy-cli -- -D warnings
          cargo clippy -p vectomancy-cli --no-default-features -- -D warnings

      - name: Build
        run: |
          cargo build --workspace --exclude vectomancy-video --exclude vectomancy-cli --verbose
          cargo build -p vectomancy-cli --no-default-features --verbose

      - name: Run tests
        run: |
          cargo test --workspace --exclude vectomancy-video --exclude vectomancy-cli --verbose
          cargo test -p vectomancy-cli --no-default-features --verbose
