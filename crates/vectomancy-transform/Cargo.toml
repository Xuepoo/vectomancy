[package]
name = "vectomancy-transform"
version = "7.1.3"
edition = "2021"
description = "Mathematical transforms (Spline, Fourier, TSP) for Vectomancy"
license = "MIT"
repository = "https://github.com/Xuepoo/vectomancy"

[dependencies]
vectomancy-geometry = { path = "../vectomancy-geometry", version = "7.1.3" }
rustfft = "6.4"
kiddo = "6"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "vectomancy-geometry/serde"]
