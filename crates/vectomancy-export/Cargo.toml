[package]
name = "vectomancy-export"
version = "7.1.0"
edition = "2021"
description = "Export and serialization encoders (JSON, SVG, HTML) for Vectomancy"
license = "MIT"
repository = "https://github.com/Xuepoo/vectomancy"

[dependencies]
vectomancy-geometry = { path = "../vectomancy-geometry" }
vectomancy-transform = { path = "../vectomancy-transform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tera = "1.19"
flate2 = "1.0"
base64 = "0.22"
