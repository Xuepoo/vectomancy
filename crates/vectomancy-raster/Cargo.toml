[package]
name = "vectomancy-raster"
version = "7.1.2"
edition = "2021"
description = "Raster image skeletonization and edge extraction for Vectomancy"
license = "MIT"
repository = "https://github.com/Xuepoo/vectomancy"

[dependencies]
vectomancy-geometry = { path = "../vectomancy-geometry", version = "7.1.2" }
image = { version = "0.25", features = ["webp"] }
imageproc = "0.26.2"
rayon = "1.8"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "vectomancy-geometry/serde"]
