[package]
name = "vectomancy-raster"
version = "8.1.0"
edition = "2021"
description = "Raster image skeletonization and edge extraction for Vectomancy"
license = "MIT"
repository = "https://github.com/Xuepoo/vectomancy"

[dependencies]
vectomancy-geometry = { path = "../vectomancy-geometry", version = "8.1.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.26.2", default-features = false, features = ["rayon"] }
rayon = "1.8"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "vectomancy-geometry/serde"]
webp = ["image/webp"]
